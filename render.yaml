services:
  - type: web
    name: coding-ai
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn config.wsgi:application --log-file -
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase: postgres-db
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CLOUDINARY_URL
        value: ""
    postDeploy: python backend/manage.py migrate --noinput
